<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熊熊動畫測試專案 - 單一檔案版</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 50px;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 90%;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }

        .bear-container {
            width: 200px;
            height: 200px;
            margin: 20px auto 0 auto;
            animation: bounce 2s infinite alternate ease-in-out;
        }

        /* 簡單的上下浮動與微縮放動畫 */
        @keyframes bounce {
            0% {
                transform: translateY(0) scale(1);
            }
            100% {
                transform: translateY(-15px) scale(1.02);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>我的第一個 GitHub 練習專案</h1>
        <p>這是一個單一檔案的網頁，已經將網頁結構、CSS 動畫與圖片全部整合在一起。</p>
        <p>非常適合用來快速測試 Git 的上傳與 GitHub Pages 預覽功能！</p>
        
        <div class="bear-container">
            <!-- 內嵌 SVG 熊熊圖片 -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
                <!-- 耳朵 -->
                <circle cx="25" cy="30" r="15" fill="#8B4513" />
                <circle cx="75" cy="30" r="15" fill="#8B4513" />
                <!-- 臉 -->
                <circle cx="50" cy="55" r="40" fill="#A0522D" />
                <!-- 眼睛 -->
                <circle cx="35" cy="45" r="5" fill="#000" />
                <circle cx="65" cy="45" r="5" fill="#000" />
                <!-- 鼻子與嘴巴區域 -->
                <ellipse cx="50" cy="65" rx="18" ry="12" fill="#D2B48C" />
                <circle cx="50" cy="60" r="4" fill="#000" />
                <!-- 嘴巴線條 -->
                <path d="M 45 68 Q 50 72 55 68" stroke="#000" stroke-width="2" fill="transparent" />
            </svg>
        </div>
    </div>
</body>
</html>
